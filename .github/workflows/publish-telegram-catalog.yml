name: Publish Telegram catalog post

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | grep -Eo '[0-9]{6,}:[A-Za-z0-9_-]{20,}' | head -n1)"
          if [ -z "$TOKEN" ]; then
            echo "Bot token format is invalid. Please replace TELEGRAM_BOT_TOKEN with the token from BotFather."
            exit 1
          fi

          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "@MDK_LUXE",
              "text": "✨ MDK LUX | КАТАЛОГ\n\nСтиль, який завжди поруч.\n\nПереглядайте жіночий та чоловічий верхній одяг, сумки й аксесуари MDK LUX.\n\nОбирайте свою модель у каталозі 👇",
              "reply_markup": {
                "inline_keyboard": [[
                  {
                    "text": "🛍 ВІДКРИТИ КАТАЛОГ",
                    "url": "https://olgavelvet.github.io/mdklux-catalog/"
                  }
                ]]
              }
            }'
